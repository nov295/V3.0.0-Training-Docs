<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MDP V3.0.0 培训</title>
<style>
:root{--blue:#1d4ed8;--indigo:#4338ca;--cyan:#0891b2;--green:#15803d;--red:#b91c1c;--amber:#b45309;--purple:#6d28d9;--bg:#fcfcfd;--card:#fff;--border:#dde1e8;--text:#1a1d24;--text2:#525860;--muted:#969ca8}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:22px;-webkit-text-size-adjust:100%}
body{font-family:'Microsoft YaHei','PingFang SC','SimHei',sans-serif;background:linear-gradient(150deg,#f8fafc,#eff6ff,#f0fdf4);color:var(--text);overflow:hidden;height:100vh;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body.sc{cursor:default}
.slide{position:absolute;inset:0;background:linear-gradient(150deg,#f8fafc,#eff6ff,#f0fdf4);padding:4vh 5vw 5vh;opacity:0;transform:translateY(16px);transition:opacity .3s,transform .3s;pointer-events:none;overflow-y:auto;display:none}
.slide.on{opacity:1;transform:translateY(0);pointer-events:auto;display:flex;flex-direction:column;justify-content:center}
.slide::-webkit-scrollbar{width:4px}
.slide::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
h1{font-size:3.4rem;font-weight:700;line-height:1.2;color:#0b1220}
h2{font-size:2.6rem;font-weight:700;margin-bottom:.8rem;color:#0b1220}
h3{font-size:1.4rem;font-weight:600;margin-bottom:.4rem}
.s1{font-size:1.1rem;color:var(--text2);line-height:1.7;margin-bottom:1rem}
.s2{font-size:.85rem;color:var(--muted)}
.r{display:flex;gap:.8rem;width:100%;flex-wrap:wrap}
.r>*{flex:1;min-width:0}
.c2>.card,.c2>.box{flex:0 0 calc(50% - .4rem)}
.c3>.card,.c3>.box{flex:0 0 calc(33.33% - .55rem)}
.c4>.card{flex:0 0 calc(25% - .6rem)}
.c5>.card{flex:0 0 calc(20% - .64rem)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.2rem 1.3rem;line-height:1.6;box-shadow:0 1px 4px rgba(0,0,0,.03);position:relative}
.card.b-blue{border-left:4px solid var(--blue)}.card.b-green{border-left:4px solid var(--green)}.card.b-red{border-left:4px solid var(--red)}.card.b-amber{border-left:4px solid var(--amber)}.card.b-purple{border-left:4px solid var(--purple)}.card.b-cyan{border-left:4px solid var(--cyan)}.card.b-indigo{border-left:4px solid var(--indigo)}
.card h3{font-size:1.2rem}.card .n{font-size:2.6rem;font-weight:700;opacity:.15;position:absolute;top:.1rem;right:.7rem;line-height:1}
.card p,.card li{font-size:.9rem;color:var(--text2)}.card ul{padding-left:1.1rem;margin-top:.4rem}.card li{margin-bottom:.2rem}
.box{border-radius:12px;padding:1.2rem;line-height:1.7}
.box.bad{background:#fef2f2;border:1px solid #fecaca}.box.good{background:#f0fdf4;border:1px solid #bbf7d0}
.box .lbl{font-size:.7rem;font-weight:700;letter-spacing:.06em;margin-bottom:.6rem;display:inline-block;padding:2px 10px;border-radius:4px}
.box.bad .lbl{background:#fee2e2;color:var(--red)}.box.good .lbl{background:#dcfce7;color:var(--green)}
.flow{display:flex;gap:.5rem;align-items:stretch;margin:1rem 0}
.flow>div{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1rem;text-align:center;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.03)}
.flow>div .sn{font-size:.7rem;color:var(--blue);font-weight:700}.flow>div h4{font-size:1rem;margin:.3rem 0}.flow>div p{font-size:.8rem;color:var(--text2);line-height:1.6}
.flow>.ar{flex:0 0 auto;display:flex;align-items:center;font-size:1.4rem;color:var(--blue);font-weight:700;background:none;border:none;box-shadow:none}.flow>.dim{opacity:.35}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0}
thead th{background:#f1f4f9;color:var(--text);padding:.55rem .8rem;text-align:left;font-weight:700;font-size:.75rem;border-bottom:2px solid var(--border)}
tbody td{padding:.5rem .8rem;border-bottom:1px solid var(--border);color:var(--text2)}tbody tr:nth-child(even) td{background:#fafbfc}
.note{border-radius:10px;padding:.8rem 1.2rem;margin:.8rem 0;font-size:.9rem;border-left:4px solid var(--blue);background:#eff6ff;line-height:1.7}
.note.wa{border-left-color:var(--amber);background:#fffbeb}.note.ok{border-left-color:var(--green);background:#f0fdf4}
.img-cmp{display:flex;gap:.8rem;margin:.8rem 0}.img-cmp>div{flex:1;text-align:center}
.img-cmp img{width:100%;max-height:28vh;object-fit:contain;border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:transform .15s}
.img-cmp img:hover{transform:scale(1.02)}.img-cmp .cap{font-size:.75rem;color:var(--muted);margin-top:.3rem}
.img-swap{position:relative;cursor:pointer;border-radius:8px;overflow:hidden}
.img-swap img{width:100%;max-height:28vh;object-fit:contain;display:block;border-radius:8px;border:1px solid var(--border)}
.img-swap .dot{position:absolute;bottom:6px;right:8px;background:rgba(0,0,0,.55);color:#fff;font-size:.7rem;padding:1px 8px;border-radius:10px;pointer-events:none}
#fs-overlay{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.92);cursor:pointer;align-items:center;justify-content:center}
#fs-overlay.on{display:flex}#fs-row{display:flex;align-items:center;gap:.6rem}#fs-img-wrap{display:flex;flex-direction:column;align-items:center}#fs-img{max-width:88vw;max-height:90vh;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5);cursor:pointer}
.fs-nav{width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:1.6rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0;line-height:1}.fs-nav:hover{background:rgba(255,255,255,.25)}.fs-nav.hide{visibility:hidden}#fs-counter{color:#fff;font-size:.8rem;margin-top:.5rem;opacity:.6;pointer-events:none}
.dia{background:#f1f4f9;border:1px solid var(--border);border-radius:12px;padding:1rem 1.3rem;margin:.8rem 0;font-family:Consolas,'Microsoft YaHei',monospace;font-size:.8rem;line-height:1.5;white-space:pre;overflow-x:auto;color:var(--text2)}
.tmap{display:flex;justify-content:center;align-items:center;gap:.7rem;margin:1rem 0;flex-wrap:wrap}
.tmap>span{padding:.6rem 1.1rem;border-radius:8px;font-weight:700;font-size:.9rem}
.tmap .tm-old{background:#fef2f2;border:1px solid #fecaca;color:var(--red)}.tmap .tm-new{background:#f0fdf4;border:1px solid #bbf7d0;color:var(--green)}.tmap .tm-ar{font-size:1.2rem;color:var(--muted);border:none;background:none}
.cover{text-align:center}
.cover h1{font-size:4.2rem;color:var(--blue)}
.divider{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.divider .dn{font-size:6rem;font-weight:700;line-height:1;opacity:.1}
.divider h2{margin-top:-1.5rem}

.topbar{position:fixed;top:0;left:0;right:0;z-index:40;pointer-events:none;padding:.5rem 1.2rem;font-size:.75rem}
.topbar .tp{color:var(--blue);font-weight:700}.topbar .tt{color:var(--text2)}
.botbar{position:fixed;bottom:0;left:0;right:0;z-index:40;pointer-events:none;display:flex;justify-content:center;padding:.5rem;gap:1.5rem}
.botbar .ctr{font-size:.75rem;color:var(--muted)}

#toc-btn{position:fixed;top:1rem;right:1rem;z-index:210;width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:1rem;color:var(--text2);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:all .2s}
#toc-btn:hover{background:#dbeafe;color:var(--blue)}
#toc-panel{position:fixed;top:3.5rem;right:1rem;z-index:210;background:var(--bg);border:1px solid var(--border);border-radius:12px;width:280px;max-height:70vh;overflow-y:auto;padding:1rem;box-shadow:0 4px 24px rgba(0,0,0,.12);display:none}
#toc-panel.on{display:block}
#toc-panel h3{font-size:1rem;margin-bottom:.5rem;color:var(--blue);padding-bottom:.4rem;border-bottom:1px solid var(--border)}
#toc-panel .ti{display:flex;align-items:center;gap:.5rem;padding:.4rem .4rem;border-radius:6px;cursor:pointer;font-size:.8rem;color:var(--text2);transition:background .15s}
#toc-panel .ti:hover{background:#f1f4f9}
#toc-panel .ti.on{background:#dbeafe;color:var(--blue);font-weight:600}
#toc-panel .ti .tn{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;flex-shrink:0;background:#f1f4f9}
#toc-panel .ti.on .tn{background:var(--blue);color:#fff}
#toc-panel .sh{font-size:.65rem;font-weight:700;color:var(--blue);padding:.5rem .3rem .1rem;letter-spacing:.04em}
@media(max-width:1000px){html{font-size:17px}.c3>.card,.c3>.box,.c4,.c5{flex-wrap:wrap}.c3>.card,.c3>.box,.c4>.card,.c5>.card{flex:0 0 calc(50% - .4rem)}}
@media(max-width:700px){html{font-size:14px}.c2>.card,.c2>.box,.c3>.card,.c3>.box,.c4>.card,.c5>.card{flex:0 0 100%}.flow{flex-direction:column}.flow>.ar{display:none}.slide{padding:3vh 4vw 4vh}}
</style>
</head>
<body>

<button id="toc-btn" onclick="event.stopPropagation();toggleToc()">☰</button>
<div id="toc-panel"><h3>目录</h3><div id="toc-list"></div></div>
<div class="topbar"><span class="tp" id="bc-part"></span> <span id="bc-sep" style="color:var(--muted)">/</span> <span class="tt" id="bc-title"></span></div>
<div class="slide-wrap" id="app"></div>
<div class="botbar"><span class="ctr">← → 翻页</span><span class="ctr" id="counter"></span><span class="ctr">Space 下一页</span></div>

<div id="fs-overlay"><div id="fs-row"><button id="fs-prev" class="fs-nav" onclick="fsNav(-1)">&lsaquo;</button><div id="fs-img-wrap"><img id="fs-img" src="" alt=""><span id="fs-counter"></span></div><button id="fs-next" class="fs-nav" onclick="fsNav(1)">&rsaquo;</button></div></div>
<script>
const S=[];function add(t,h){S.push({title:t,html:h})}
function dv(p,c,t,d){return`<div class="divider"><div class="dn" style="color:${c}">${p}</div><h2>${t}</h2><p class="s1">${d}</p></div>`}

// 0
add('封面',`<div class="cover"><h1>Milesight Development Platform<br>V3.0.0 版本迭代培训</h1>
  <p class="s1" style="font-size:1.2rem;margin-top:1rem">UI 重构 · Profile 新格式 · 其他优化</p>
  <p style="font-size:.9rem;color:var(--muted);margin-top:.8rem">计划发版时间：2026年7月4日（以最终通知为准）</p></div>`);
// 1
add('迭代概览',`<h2>V3.0.0 迭代概览</h2>
<div class="r c3">
  <div class="card b-blue" style="background:#eff6ff"><div class="n">01</div><h3>UI 重构</h3><ul><li>风格调整</li><li>信息结构重构</li><li>去专业化概念</li><li>操作效率优化</li><li>流程优化</li></ul></div>
  <div class="card b-purple" style="background:#faf5ff"><div class="n">02</div><h3>Profile 新格式</h3><ul><li>关键配置参数统一纳管</li><li>表单配置菜单化</li><li>TOML 格式支持</li><li>代码编辑器接入</li></ul></div>
  <div class="card b-indigo" style="background:#eef2ff"><div class="n">03</div><h3>其他优化</h3><ul><li>连接链路字段</li><li>设备配置固化</li><li>兼容IPC设备17位SN</li><li>日语支持</li></ul></div>
</div>`);
// 2 — divider Part 1
add('Part 1',dv('Part 1','var(--blue)','UI 重构','风格调整 · 信息结构 · 去专业化 · 操作效率 · 流程优化'));
// 3
add('为什么要改？',`<h2>为什么要改？</h2>
<div class="r c3" style="margin-bottom:.6rem">
  <div class="card b-red"><h3>用户变了</h3><p>使用者从<strong>开发者</strong>→ <strong>运维 / 业务人员</strong>，原有开发者视角不再适用。</p></div>
  <div class="card b-amber"><h3>体验痛点</h3><ul><li>导航占空间，列表看不全</li><li>概念太专业（RPS、配置）</li><li>操作入口分散</li><li>状态不直观</li></ul></div>
  <div class="card b-green"><h3>目标</h3><ul><li>降低理解成本</li><li>提升操作效率</li><li>信息一目了然</li></ul></div>
</div>
<table><thead><tr><th>痛点</th><th>具体表现</th><th>解决方案</th><th>好处</th></tr></thead>
<tbody><tr><td><strong>用户角色变化</strong></td><td>使用者从开发者转为运维/业务</td><td>业务化语言、简化概念</td><td>非技术也能快速上手</td></tr><tr><td><strong>导航占用空间</strong></td><td>顶部导航压缩纵向内容区</td><td>导航移至左侧纵向</td><td>页面利用率更高</td></tr><tr><td><strong>概念过于专业</strong></td><td>"RPS""配置"不理解</td><td>RPS → "初始化配置"</td><td>一看就懂</td></tr><tr><td><strong>操作入口分散</strong></td><td>添加/配置/升级散落各处</td><td>Action 菜单统一整合</td><td>一个入口搞定所有操作</td></tr></tbody></table>
<div class="note wa"><strong>优化边界：</strong>仅涉及 UI 与交互层。以下<strong>不变</strong>：设备功能和能力逻辑 · 后端校验规则 · 数据权限体系 · RPS 独立模块内部命名。</div>`);
// 4
add('五大变化',`<h2>五大变化</h2>
<div class="r c5">
  <div class="card b-blue"><h3>风格调整</h3><p style="font-size:.85rem;color:var(--text2)">更平台化<br>更现代化</p></div>
  <div class="card b-cyan"><h3>信息结构</h3><p style="font-size:.85rem;color:var(--text2)">导航 + 概览<br>区域重构</p></div>
  <div class="card b-purple"><h3>去专业化</h3><p style="font-size:.85rem;color:var(--text2)">隐藏底层概念<br>用业务语言</p></div>
  <div class="card b-green"><h3>操作效率</h3><p style="font-size:.85rem;color:var(--text2)">入口收敛<br>操作顺手</p></div>
  <div class="card b-amber"><h3>流程优化</h3><p style="font-size:.85rem;color:var(--text2)">减少割裂<br>明确步骤</p></div>
</div>`);
// 5
add('风格调整',`<h2>风格调整</h2>
<p class="s1">更平台化、更现代化</p>
<div class="r c2" style="margin-top:.4rem">
  <div class="box bad"><span class="lbl">旧版风格</span><ul style="font-size:.85rem;color:var(--text2);line-height:1.7"><li>重灰色块导航背景</li><li>粗边框、单元格界限明显</li><li>控件紧凑排列</li><li>靠边框分割层级</li></ul><p style="color:var(--red);margin-top:.4rem;font-size:.8rem">← 偏"工具型"，视觉压迫感强</p></div>
  <div class="box good"><span class="lbl">新版风格</span><ul style="font-size:.85rem;color:var(--text2);line-height:1.7"><li>更多留白，降低视觉疲劳</li><li>弱化边框，浅灰底色区分行</li><li>适当间距，降低压迫感</li><li>靠浅灰底色 + 间距区隔层级</li></ul><p style="color:var(--green);margin-top:.4rem;font-size:.8rem">← "设备管理平台"，简洁专业</p></div>
</div>
<div class="img-cmp" style="margin-top:.8rem">
  <div><img src="screenshots/旧平台截图/设备列表/Snipaste_2026-05-09_10-08-58.png" onclick="fs(event)" title="点击查看大图"><div class="cap">旧版平台</div></div>
  <div><img src="screenshots/新平台截图/Snipaste_2026-05-30_14-32-50.png" onclick="fs(event)" title="点击查看大图"><div class="cap">新版平台</div></div>
</div>`);
// 6
add('导航栏调整',`<h2>导航栏调整</h2>
<p class="s1">信息结构调整</p>
<div class="r c2" style="margin-top:.4rem">
  <div class="box bad"><span class="lbl">旧版 — 顶部导航</span><ul style="font-size:.85rem;color:var(--text2);line-height:1.7"><li>顶部横向导航，菜单多了放不下</li><li>导航+组织树+列表，区域划分不够清晰</li><li>顶部导航时刻提醒模块名，增加认知负担</li></ul><p style="color:var(--red);margin-top:.4rem;font-size:.8rem">← 空间利用率低，扩展性受限</p></div>
  <div class="box good"><span class="lbl">新版 — 左侧导航</span><ul style="font-size:.85rem;color:var(--text2);line-height:1.7"><li>左侧纵向导航，天然支持未来模块扩展</li><li>左中右 L 型结构，视线更连贯</li><li>导航收起后更聚焦工作区，沉浸式操作</li></ul><p style="color:var(--green);margin-top:.4rem;font-size:.8rem">← 符合主流习惯，可扩展性更强</p></div>
</div>
<div class="img-cmp" style="margin-top:.8rem">
  <div><img src="screenshots/旧平台截图/设备列表/Snipaste_2026-05-09_10-08-58.png" onclick="fs(event)" title="点击查看大图"><div class="cap">旧版导航布局</div></div>
  <div><img src="screenshots/新平台截图/Snipaste_2026-05-30_16-45-20.png" onclick="fs(event)" title="点击查看大图"><div class="cap">新版导航布局</div></div>
</div>`);
// 7
add('新增设备概览区',`<h2>新增设备概览区</h2>
<p class="s1">进入系统即可直接查看设备的整体在线情况，无需手动筛选或切换到看板页面</p>
<div class="r c2">
  <div class="card b-cyan"><ul style="font-size:.9rem;color:var(--text2);line-height:2"><li>统计范围 = 当前左侧选中分组</li><li>与看板联动：点击状态 → 跳转并自动筛选</li><li>切换 Tab 保留高级筛选条件</li></ul></div>
  <div><img src="screenshots/新平台截图/Snipaste_2026-05-30_16-49-17.png" onclick="fs(event)" title="点击查看大图" style="width:100%;max-height:28vh;object-fit:contain;border-radius:8px;border:1px solid var(--border);cursor:pointer"></div>
</div>`);
// 8
add('去专业化概念',`<h2>去专业化概念</h2>
<p class="s1">用业务语言替代技术术语，降低非技术人员的理解门槛</p>
<div class="r c2">
  <div class="card b-purple">
    <div class="tmap" style="justify-content:flex-start;margin:0 0 .5rem"><span class="tm-old">RPS</span><span class="tm-ar">→</span><span class="tm-new">初始化配置</span></div>
    <p style="font-size:.9rem;color:var(--text2);line-height:1.7">用户关心的是<strong>"设备首次联网需要做什么设置"</strong>，而不是底层服务叫什么名字。从功能目的出发命名，降低非技术人员的理解门槛。</p>
    <div class="img-swap" title="点击查看大图">
	      <img onclick="fs(event)" src="screenshots/新平台截图/Snipaste_2026-06-01_11-45-55.png"><img onclick="fs(event)" src="screenshots/新平台截图/Snipaste_2026-06-01_11-50-24.png" style="display:none"><span class="dot">1/2</span>
    </div>
  </div>
  <div class="card b-purple">
    <div class="tmap" style="justify-content:flex-start;margin:0 0 .5rem"><span class="tm-old">物模型 / Profile</span><span class="tm-ar">→</span><span class="tm-new">表单配置</span></div>
    <p style="font-size:.9rem;color:var(--text2);line-height:1.7">原本区分两种技术类型，统一为<strong>表单配置</strong>，用户只需关注填表下发，不需要了解底层技术实现。</p>
    <div class="img-swap" style="cursor:default"><img src="screenshots/新平台截图/企业微信截图_17804540853109.png" onclick="fs(event)" title="点击查看大图" style="cursor:pointer"></div>

  {title:'封面 & 概览',start:0,end:1},
  {title:'Part 1 — UI 重构',start:2,end:13},
  {title:'Part 2 — Profile 新格式',start:14,end:15},

const M={
  0:['','封面'],1:['','迭代概览'],
  2:['Part1.UI重构','UI 重构'],3:['Part1.UI重构','为什么要改？'],4:['Part1.UI重构','五大变化'],
  5:['Part1.UI重构','风格调整'],6:['Part1.UI重构','导航栏调整'],

  14:['Part2.Profile 新格式','Profile 新格式'],15:['Part2.Profile 新格式','Profile 新格式详情'],
  16:['Part3.其他优化','其他优化'],17:['Part3.其他优化','连接链路/固化/日语'],
  18:['','常见问题'],19:['','问题和反馈'],
};
function getSection(i){for(const s of sections){if(i>=s.start&&i<=s.end)return s.title}return''}

let cur=0;
const app=document.getElementById('app'),counter=document.getElementById('counter');
const bcPart=document.getElementById('bc-part'),bcTitle=document.getElementById('bc-title');
const tocPanel=document.getElementById('toc-panel'),tocList=document.getElementById('toc-list');

function buildAll(){
  app.innerHTML='';
  S.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='slide'+(i===cur?' on':'');
    d.innerHTML=s.html;app.appendChild(d);
  });
  tocList.innerHTML='';
  sections.forEach(sec=>{
    if(sec.start>sec.end)return;
    const hdr=document.createElement('div');hdr.className='sh';hdr.textContent=sec.title;tocList.appendChild(hdr);
    for(let i=sec.start;i<=sec.end;i++){
      const ti=document.createElement('div');ti.className='ti'+(i===cur?' on':'');
      ti.innerHTML=`<span class="tn">${i+1}</span><span>${S[i].title}</span>`;
      ti.addEventListener('click',e=>{e.stopPropagation();go(i);closeToc();});tocList.appendChild(ti);
    }
  });
}
function upd(){
  counter.textContent=(cur+1)+' / '+S.length;
  const m=M[cur]||['',''];bcPart.textContent=m[0];bcTitle.textContent=m[1];
  document.getElementById('bc-sep').style.display=m[0]?'':'none';
  document.querySelectorAll('.ti').forEach((el,i)=>el.classList.toggle('on',i===cur));
}
function go(n){if(n<0||n>=S.length)return;document.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('on',i===n));cur=n;const a=document.querySelector('.slide.on');if(a)a.style.justifyContent=a.scrollHeight>a.clientHeight?'flex-start':'center';upd()}
function toggleToc(){tocPanel.classList.toggle('on')}
function closeToc(){tocPanel.classList.remove('on')}

let fsGroup=[],fsIdx=0;
function fs(e){
  e.stopPropagation();
  const img=e.target;
  const swap=img.closest('.img-swap');
  if(swap){
    fsGroup=Array.from(swap.querySelectorAll('img'));
    fsIdx=fsGroup.indexOf(img);
  }else{
    fsGroup=[img];
    fsIdx=0;
  }
  updateFs();
  document.getElementById('fs-overlay').classList.add('on');
}
function fsOverlayClick(e){
  if(e.target===document.getElementById('fs-overlay')||e.target===document.getElementById('fs-img')){
    document.getElementById('fs-overlay').classList.remove('on');
  }
}
function updateFs(){
  const multi=fsGroup.length>1;
  document.getElementById('fs-prev').classList.toggle('hide',!multi);
  document.getElementById('fs-next').classList.toggle('hide',!multi);
  document.getElementById('fs-img').src=fsGroup[fsIdx].src;
  const c=document.getElementById('fs-counter');
  c.textContent=multi?(fsIdx+1)+' / '+fsGroup.length:'';
}
function fsNav(dir){
  fsIdx=(fsIdx+dir+fsGroup.length)%fsGroup.length;
  updateFs();
}
document.getElementById('fs-overlay').addEventListener('click',fsOverlayClick);
document.addEventListener('click',e=>{if(!tocPanel.contains(e.target)&&e.target!==document.getElementById('toc-btn'))closeToc()});
buildAll();upd();
let lastNav=0;
document.addEventListener('keydown',e=>{
  e.preventDefault();
  if(e.key==='Escape'){closeToc();document.getElementById('fs-overlay').classList.remove('on');return}
  if(e.key==='t'||e.key==='T'){toggleToc();return}
  const now=Date.now();if(now-lastNav<350)return;
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'||e.key==='PageUp'){closeToc();lastNav=now;go(cur-1);return}
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){closeToc();lastNav=now;go(cur+1);return}
  if(e.key==='Home'){closeToc();lastNav=now;go(0);return}
  if(e.key==='End'){closeToc();lastNav=now;go(S.length-1);return}
});
let tx=0,ty=0;document.addEventListener('touchstart',e=>{tx=e.changedTouches[0].screenX;ty=e.changedTouches[0].screenY});
document.addEventListener('touchend',e=>{
  if(tocPanel.classList.contains('on'))return;
  const dx=e.changedTouches[0].screenX-tx,dy=e.changedTouches[0].screenY-ty;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>50)go(cur+(dx<0?1:-1));
});
document.addEventListener('mousemove',()=>{document.body.classList.add('sc')});
</script>
</body>
